# Production profile overrides.
# Enable JWT validation in production and require all sensitive values via environment variables.

security.auth.enabled=false

# TODO(worthIt): provide real values via env vars / secret manager in prod:
#   SECURITY_JWT_ISSUER, SECURITY_JWT_JWKS_URI, SECURITY_JWT_EXPECTED_AUDIENCE,
#   APP_SECURITY_CORS_ALLOWED_ORIGINS
#security.jwt.issuer=${SECURITY_JWT_ISSUER:}
#security.jwt.jwks-uri=${SECURITY_JWT_JWKS_URI:}
#security.jwt.expected-audience=${SECURITY_JWT_EXPECTED_AUDIENCE:}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://tryworthit.netlify.app,http://localhost:3000}
# DigitalOcean App Platform is the trusted production ingress and supplies DO-Connecting-IP.
app.security.client-ip.trust-forwarded-headers=${APP_SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS:true}
app.seed.enabled=false

logging.level.root=INFO
logging.level.com.worthit.backend=INFO

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false