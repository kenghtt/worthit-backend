spring.application.name=worthit-backend

# Default profile for local dev. Override with -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE.
spring.profiles.active=prod

# Optional, app-local secrets file (kept out of git). Loaded only if present.
spring.config.import=optional:secrets.properties

# Server
server.port=8080

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# CORS
# Comma-separated list of allowed origins for the frontend(s).
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://tryworthit.netlify.app}
app.security.client-ip.trust-forwarded-headers=false
app.security.max-request-body-bytes=32768
server.max-http-request-header-size=8KB

# -----------------------------------------------------------------------------
# Database / JPA
# -----------------------------------------------------------------------------
# Datasource. Override per-profile (see application-local.properties / application-prod.properties).
# Password is expected to come from secrets.properties or an env var (SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/worthit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:worthit_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool sizing (spec section 6.8: 10-20).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate.
# Keep update for now so existing entity-driven workflow continues.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Database Seeding
app.seed.enabled=false

# Submit flow
app.submit.worth-it-reason-max-length=1000
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
app.turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES:tryworthit.netlify.app}
app.turnstile.connect-timeout=2s
app.turnstile.read-timeout=5s
app.feedback.rate-limit.max-submissions=5
app.feedback.rate-limit.window=1h

# In-memory API rate limits. Override any value with its matching environment variable.
app.rate-limit.enabled=true
app.rate-limit.max-tracked-buckets=50000
app.rate-limit.global.max-requests=300
app.rate-limit.global.window=1m
app.rate-limit.search.max-requests=60
app.rate-limit.search.window=1m
app.rate-limit.read.max-requests=120
app.rate-limit.read.window=1m
app.rate-limit.submission-attempts.max-requests=10
app.rate-limit.submission-attempts.window=10m
app.rate-limit.successful-experience-submissions.max-requests=5
app.rate-limit.successful-experience-submissions.window=1h
app.rate-limit.probes.max-requests=60
app.rate-limit.probes.window=1m

# Post Hog Config
app.posthog.project-token=${POSTHOG_PROJECT_TOKEN:phc_mop9Yn37Mg0tuLJWNbLGZlVyj8I5abP0afEYwxgd1Z5}
app.posthog.host=${POSTHOG_HOST:https://us.i.posthog.com}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.worthit.backend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
